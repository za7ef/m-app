name: Android emulator smoke test

on:
  workflow_dispatch:

jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - run: npm install
      - run: npx expo prebuild -p android --clean --no-install
      - name: Build release APK (x86_64 for the emulator, debug key)
        env:
          NODE_ENV: production
        run: cd android && ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=x86_64
      - name: Run on emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb logcat -c
            adb shell monkey -p com.za7ef.mapp -c android.intent.category.LAUNCHER 1
            sleep 45
            adb shell pidof com.za7ef.mapp && echo "APP STILL RUNNING" || echo "APP NOT RUNNING"
            adb exec-out screencap -p > screen.png || true
            adb logcat -d > logcat.txt || true
            grep -nE "FATAL|AndroidRuntime|ReactNativeJS|Exception|SoLoader|libc" logcat.txt | head -200 || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-logs
          path: |
            logcat.txt
            screen.png
