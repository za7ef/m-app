plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.mtorrent'
version = '1.0.0'

android {
  namespace "expo.modules.mtorrent"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

// engine/build.sh (gomobile) writes libs/mtorrent.aar. AGP refuses direct local .aar deps in library
// modules, so expose it as a tiny local Maven repo that every project (including :app) can resolve.
def engineAar = file('libs/mtorrent.aar')
def repoDir = file("${buildDir}/engine-repo")
def artifactDir = new File(repoDir, 'com/za7ef/mtorrent/1.0.0')
if (engineAar.exists()) {
  artifactDir.mkdirs()
  ant.copy(file: engineAar, tofile: new File(artifactDir, 'mtorrent-1.0.0.aar'), overwrite: true)
  new File(artifactDir, 'mtorrent-1.0.0.pom').text = '''<?xml version="1.0" encoding="UTF-8"?>
<project xmlns="http://maven.apache.org/POM/4.0.0"><modelVersion>4.0.0</modelVersion>
<groupId>com.za7ef</groupId><artifactId>mtorrent</artifactId><version>1.0.0</version><packaging>aar</packaging></project>
'''
}
rootProject.allprojects { p ->
  p.repositories { maven { url repoDir.toURI() } }
}

dependencies {
  implementation 'com.za7ef:mtorrent:1.0.0'
}
